# Runs the unit tests on every push to main and every pull request; the
# "tests" badge in the README shows the result for main.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the Android platform the app compiles against
        # The package is "android-37.0" (Google names newer platforms with a
        # minor version). The runner has the SDK licences accepted already.
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null

      - name: Unit tests
        # "bash" because gradlew is committed without its executable bit.
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
