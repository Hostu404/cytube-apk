# Builds a signed release APK every night and publishes it as the "nightly"
# pre-release on GitHub, replacing the previous night's. Skipped when nothing
# has been pushed since the last nightly. Can also be run by hand from the
# Actions tab (Nightly build → Run workflow), which always builds.
#
# Needs three repository secrets (Settings → Secrets and variables →
# Actions → Secrets):
#   KEYSTORE_BASE64    the release .jks, base64-encoded
#   KEYSTORE_PASSWORD  its storePassword
#   KEY_PASSWORD       its keyPassword
# and one variable (same page → Variables):
#   KEY_ALIAS          its keyAlias
# The same keystore as your normal releases, so a nightly installs over them.

name: Nightly build

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC every day
  workflow_dispatch:

permissions:
  contents: write   # to move the nightly tag and replace its release

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Anything new since the last nightly?
        id: changes
        run: |
          last=$(git rev-parse -q --verify "refs/tags/nightly^{commit}" || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$(git rev-parse HEAD)" ]; then
            echo "No new commits since the last nightly; skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.changes.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        if: steps.changes.outputs.build == 'true'

      - name: Install the Android platform the app compiles against
        if: steps.changes.outputs.build == 'true'
        # The package is "android-37.0" (Google names newer platforms with a
        # minor version). The runner has the SDK licences accepted already.
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" > /dev/null

      - name: Set up release signing
        if: steps.changes.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # A variable, not a secret: it only names the key in the file, and
          # as a secret every "cytube" in the logs would be masked as ***.
          KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > nightly-release.jks
          {
            echo "storeFile=nightly-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        if: steps.changes.outputs.build == 'true'
        run: |
          stamp="$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)"
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease -PnightlyBuild="$stamp"
          cp app/build/outputs/apk/release/app-release.apk "cytube-nightly-$stamp.apk"

      - name: Publish the nightly release
        if: steps.changes.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          commit=$(git rev-parse --short HEAD)
          # The newest real release this build has everything since.
          since=$(git describe --tags --abbrev=0 --exclude nightly 2>/dev/null || true)
          {
            echo "**Nightly build** · $(date -u '+%-d %b %Y') · commit [\`$commit\`]($REPO_URL/commit/$commit)"
            echo
            echo "Built from the newest code, with the unit tests passing. It's ahead of the latest release but hasn't had a release's hands-on testing yet, so if something's off, the [latest release]($REPO_URL/releases/latest) is the steadier choice."
            echo
            echo "Installs over the normal app, and the normal app installs back over it."
            if [ -n "$since" ]; then
              echo
              echo "### New since $since"
              echo
              # Only commits that changed the app itself (app/src/main), so
              # README, workflow and test-only commits stay out. A commit
              # can also leave itself out with "[skip notes]" in its message.
              changes=$(git log --no-merges --invert-grep --fixed-strings --grep='[skip notes]' \
                --format='- %s (%h)' "$since..HEAD" -- app/src/main | head -n 30)
              echo "${changes:-No changes to the app itself yet, only to the project around it.}"
              echo
              echo "[All changes since $since]($REPO_URL/compare/$since...$commit)"
            fi
          } > nightly-notes.md
          gh release delete nightly --yes --cleanup-tag || true
          git tag -f nightly
          git push -f origin refs/tags/nightly
          gh release create nightly "cytube-nightly-$STAMP.apk" \
            --prerelease \
            --title "Nightly $(date -u '+%-d %b %Y')" \
            --notes-file nightly-notes.md

      - name: Remove the signing files
        if: always()
        run: rm -f nightly-release.jks keystore.properties
