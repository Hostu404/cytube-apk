org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Which JDK actually runs Gradle's daemon is pinned in
# gradle/gradle-daemon-jvm.properties (toolchainVersion=17) instead of here —
# that mechanism auto-discovers or auto-downloads a matching JDK on whatever
# machine builds this, so it works for every clone. A hardcoded
# org.gradle.java.home used to live here pointing at one specific machine's
# JDK install folder; that only worked on that one machine and would have
# broken the build for anyone else who checked this out, so don't reintroduce
# it — if a future JDK version mismatch comes up again, fix the version
# number in gradle-daemon-jvm.properties instead.
