org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Which JDK actually runs Gradle's daemon is pinned in
# gradle/gradle-daemon-jvm.properties (toolchainVersion=17) instead of here —
# that mechanism finds a JDK 17 on whatever machine builds this, or downloads
# one from the addresses listed in that file (the toolchainUrl lines), so it
# works for every clone, including one whose only JDK is newer. A hardcoded
# org.gradle.java.home used to live here pointing at one specific machine's
# JDK install folder; that only worked on that one machine and would have
# broken the build for anyone else who checked this out, so don't reintroduce
# it — if a future JDK version mismatch comes up again, regenerate that file
# with `./gradlew updateDaemonJvm --jvm-version=<N>` instead (it rewrites the
# download addresses too, using the foojay resolver in settings.gradle.kts;
# editing only the version there would leave addresses for the old one).
